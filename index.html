<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חברות מזייפות - שינוי סולם למוזיקה</title>
    <script>
        // Set base href dynamically based on environment
        if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
            // Production (GitHub Pages)
            document.write('<base href="/Transpose/">');
        } else {
            // Local development - use root
            document.write('<base href="/">');
        }
    </script>
    <meta name="description" content="שינוי סולם מקצועי למוזיקה שלך">
    
    <script>
        // Dynamically set favicon and manifest paths
        // Use APP_BASE_PATH if available, otherwise determine it
        const basePath = typeof APP_BASE_PATH !== 'undefined' ? APP_BASE_PATH : 
            ((window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') 
                ? '/Transpose/' 
                : '/');
        
        // Favicon
        const favicon = document.createElement('link');
        favicon.rel = 'icon';
        favicon.type = 'image/svg+xml';
        favicon.href = basePath + 'favicon.svg';
        document.head.appendChild(favicon);
        
        const faviconIco = document.createElement('link');
        faviconIco.rel = 'alternate icon';
        faviconIco.href = basePath + 'favicon.ico';
        document.head.appendChild(faviconIco);
        
        // Manifest
        const manifest = document.createElement('link');
        manifest.rel = 'manifest';
        manifest.href = basePath + 'manifest.webmanifest';
        document.head.appendChild(manifest);
    </script>
    
    <meta name="theme-color" content="#3b82f6">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="חברות מזייפות">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }
        
        .song-card {
            transition: all 0.3s ease;
        }
        
        .song-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        
        /* Horizontal song list scrollbar styling */
        .overflow-x-auto::-webkit-scrollbar {
            height: 8px;
        }
        
        .overflow-x-auto::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        
        .overflow-x-auto::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        
        .overflow-x-auto::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        /* Smooth scrolling for song list */
        .overflow-x-auto {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    
    <div id="app-content"></div>
    
    <script>
        // GitHub Pages SPA redirect handler
        (function() {
            var redirect = sessionStorage.redirect;
            delete sessionStorage.redirect;
            if (redirect && redirect != location.href) {
                history.replaceState(null, null, redirect);
            }
        })();
        
        // Global base path - used across all functions
        const APP_BASE_PATH = (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') 
            ? '/Transpose/' 
            : '/';
        
        // Load manifest and render appropriate page
        async function init() {
            try {
                const response = await fetch(APP_BASE_PATH + 'public/tracks.manifest.json');
                const manifest = await response.json();
                // Remove base path (if on GitHub Pages) and leading/trailing slashes
                let path = window.location.pathname;
                
                // On GitHub Pages, strip /Transpose/ prefix
                if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
                    path = path.replace(/^\/Transpose\/?/i, '');
                }
                
                // Clean up path
                path = path.replace(/^\/+|\/+$/g, '');
                
                // Check for band mode: /band/songid
                if (path.startsWith('band/')) {
                    const songId = path.replace('band/', '');
                    const track = manifest.tracks.find(t => t.id === songId);
                    if (track) {
                        renderBandPage(track);
                    } else {
                        render404();
                    }
                } else if (!path || path === 'index.html') {
                    // Show all tracks
                    renderHomePage(manifest.tracks);
                } else if (manifest.collections && manifest.collections[path]) {
                    // Show collection
                    const collection = manifest.collections[path];
                    const collectionTracks = collection.tracks
                        .map(trackId => manifest.tracks.find(t => t.id === trackId))
                        .filter(t => t); // Remove nulls
                    renderHomePage(collectionTracks, collection.name);
                } else {
                    // Show individual track player (singer mode)
                    const track = manifest.tracks.find(t => t.id === path);
                    if (track) {
                        renderPlayerPage(track);
                    } else {
                        render404();
                    }
                }
            } catch (error) {
                console.error('Error loading:', error);
                renderError(error.message);
            }
        }
        
        function renderHomePage(tracks, collectionName = null) {
            const title = collectionName ? `${collectionName} - חברות מזייפות` : 'חברות מזייפות - בחר שיר';
            document.title = title;
            
            document.getElementById('app-content').innerHTML = `
                <div class="flex flex-col min-h-screen">
                    <!-- Top Bar with Song List -->
                    <div class="bg-white border-b border-gray-200 shadow-sm flex-shrink-0">
                        <div class="p-4 bg-gradient-to-r from-blue-50 to-purple-50">
                            <div class="max-w-7xl mx-auto">
                                <div class="flex items-center gap-3 mb-3">
                                    <h1 class="text-2xl font-bold text-gray-800">חברות מזייפות</h1>
                                    ${collectionName ? `<h2 class="text-lg font-semibold text-gray-700">• ${escapeHtml(collectionName)}</h2>` : ''}
                                </div>
                                
                                <!-- Horizontal Song List -->
                                <div class="overflow-x-auto">
                                    <div id="song-list" class="flex gap-3 pb-2">
                                        ${tracks.map(track => `
                                            <div class="song-item flex-shrink-0 w-48 p-3 bg-white hover:bg-blue-50 rounded-lg cursor-pointer transition border-2 border-transparent hover:border-blue-400 shadow-sm" data-track-id="${track.id}">
                                                <h3 class="font-semibold text-gray-800 text-sm truncate">${escapeHtml(track.title)}</h3>
                                                <p class="text-xs text-gray-600 truncate">${escapeHtml(track.artist)}</p>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Player Area -->
                    <div class="flex-1 flex flex-col">
                        <div class="flex-1 flex items-center justify-center p-8 bg-gradient-to-br from-blue-50 to-purple-50">
                            <div class="w-full max-w-2xl">
                                <div id="player-container">
                                    <div class="text-center text-gray-400 py-20">
                                        <div class="text-6xl mb-4">🎧</div>
                                        <p class="text-xl">בחר שיר להתחלה</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="bg-white border-t border-gray-200 p-4 text-center text-sm text-gray-600 shadow-sm flex-shrink-0">
                            <p dir="ltr">⌨️ Shortcuts: <kbd class="px-2 py-1 bg-gray-100 rounded border border-gray-300">Space</kbd> Play/Pause • 
                            <kbd class="px-2 py-1 bg-gray-100 rounded border border-gray-300">←</kbd> -5s • 
                            <kbd class="px-2 py-1 bg-gray-100 rounded border border-gray-300">→</kbd> +5s •
                            <kbd class="px-2 py-1 bg-gray-100 rounded border border-gray-300">↑</kbd> Pitch+ •
                            <kbd class="px-2 py-1 bg-gray-100 rounded border border-gray-300">↓</kbd> Pitch-</p>
                        </div>
                    </div>
                </div>
            `;
            
            // Setup song selection
            setupSongList(tracks);
        }
        
        function renderPlayerPage(track) {
            document.title = `${track.title} - חברות מזייפות`;
            document.getElementById('app-content').innerHTML = `
                <div class="min-h-screen bg-gray-50 flex flex-col">
                    <!-- Header -->
                    <div class="bg-white border-b border-gray-200 p-4 shadow-sm">
                        <div class="max-w-4xl mx-auto flex items-center justify-between">
                            <a href="./" class="text-blue-600 hover:text-blue-700 flex items-center font-semibold">
                                <span class="ml-2">→</span>
                                <span>חזרה לשירים</span>
                            </a>
                            <div class="text-center">
                                <h1 class="text-xl font-bold text-gray-800">${escapeHtml(track.title)}</h1>
                                <p class="text-sm text-gray-600">${escapeHtml(track.artist)}</p>
                                <div class="mt-1 flex gap-2 justify-center">
                                    <span class="text-xs bg-purple-100 text-purple-700 px-2 py-1 rounded">זמר/ת</span>
                                    <a href="band/${track.id}" class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded hover:bg-blue-200">
                                        🎸 מצב להקה
                                    </a>
                                </div>
                            </div>
                            <div class="w-24"></div>
                        </div>
                    </div>
                    
                    <!-- Player -->
                    <div class="flex-1 flex items-center justify-center p-8 bg-gradient-to-br from-blue-50 to-purple-50">
                        <div class="w-full max-w-2xl">
                            <div id="player-container"></div>
                        </div>
                    </div>
                    
                    <!-- Footer -->
                    <div class="bg-white border-t border-gray-200 p-4 text-center text-sm text-gray-600 shadow-sm">
                        <p dir="ltr">⌨️ Shortcuts: <kbd class="px-2 py-1 bg-gray-100 rounded border border-gray-300">Space</kbd> Play/Pause • 
                        <kbd class="px-2 py-1 bg-gray-100 rounded border border-gray-300">←</kbd> -5s • 
                        <kbd class="px-2 py-1 bg-gray-100 rounded border border-gray-300">→</kbd> +5s •
                        <kbd class="px-2 py-1 bg-gray-100 rounded border border-gray-300">↑</kbd> Pitch+ •
                        <kbd class="px-2 py-1 bg-gray-100 rounded border border-gray-300">↓</kbd> Pitch-</p>
                    </div>
                </div>
            `;
            
            // Load player script
            loadPlayer(track);
        }
        
        function renderBandPage(track) {
            document.title = `${track.title} - Band - חברות מזייפות`;
            document.getElementById('app-content').innerHTML = `
                <div class="flex flex-col min-h-screen bg-gray-50">
                    <!-- Header -->
                    <div class="bg-white border-b border-gray-200 p-4 shadow-sm flex-shrink-0">
                        <div class="max-w-7xl mx-auto flex items-center justify-between">
                            <a href="./" class="text-blue-600 hover:text-blue-700 flex items-center font-semibold">
                                <span class="ml-2">→</span>
                                <span>חזרה לשירים</span>
                            </a>
                            <div class="text-center">
                                <h1 class="text-xl font-bold text-gray-800">${escapeHtml(track.title)}</h1>
                                <p class="text-sm text-gray-600">${escapeHtml(track.artist)}</p>
                                <div class="mt-1 flex gap-2 justify-center">
                                    <span class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded">🎸 מצב להקה</span>
                                    <a href="${track.id}" class="text-xs bg-purple-100 text-purple-700 px-2 py-1 rounded hover:bg-purple-200">
                                        מצב זמר/ת
                                    </a>
                                </div>
                            </div>
                            <div class="w-24"></div>
                        </div>
                    </div>
                    
                    <!-- Stem Controls (20% height) -->
                    <div class="bg-gradient-to-br from-blue-50 to-purple-50 border-b border-gray-200 flex-shrink-0" style="height: 20vh; min-height: 180px;">
                        <div class="max-w-7xl mx-auto h-full flex flex-col p-4">
                            <!-- Loading/Error Messages -->
                            <div id="track-loading" class="text-center text-blue-600 mb-2">
                                <div class="inline-block animate-spin rounded-full h-4 w-4 border-b-2 border-blue-600"></div>
                                <span class="ml-1 text-xs">Loading stems...</span>
                            </div>
                            
                            <div id="error-message" class="hidden text-center text-red-600 mb-2 text-xs"></div>
                            
                            <!-- Main Row: Playback Controls (horizontal) side-by-side with Stem Controls (vertical) -->
                            <div class="flex-1 flex gap-4 items-stretch">
                                <!-- Left Side: Horizontal Playback Controls -->
                                <div class="flex flex-col justify-between" style="min-width: 200px; max-width: 300px;">
                                    <div class="text-xs text-gray-600 mb-2 text-right">S = סולו • M = השתק</div>
                                    
                                    <div class="flex flex-col gap-3" dir="ltr">
                                        <!-- Play/Pause Button -->
                                        <button id="play-pause-btn" class="w-12 h-12 rounded-full bg-blue-600 hover:bg-blue-700 text-white flex items-center justify-center transition flex-shrink-0 mx-auto">
                                            <svg id="play-pause-icon" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                                                <path d="M8 5v14l11-7z"/>
                                            </svg>
                                        </button>
                                        
                                        <!-- Seek Bar (Horizontal) -->
                                        <div class="flex flex-col gap-1">
                                            <input id="seek-bar" type="range" min="0" max="100" value="0" 
                                                class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                                            
                                            <!-- Time Display -->
                                            <div class="text-xs font-mono text-gray-600 text-center">
                                                <span id="current-time">0:00</span> / <span id="total-time">0:00</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                <!-- Right Side: Vertical Stem Controls -->
                                <div class="flex-1 flex flex-col">
                                    <div id="stem-controls" class="flex-1 flex gap-2 justify-center items-end pb-1"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Chords Area (80% height) -->
                    <div class="flex-1 flex items-center justify-center p-8 bg-white" style="min-height: 60vh;">
                        <div class="w-full h-full max-w-2xl mx-auto">
                            <div id="chords-container" class="w-full h-full"></div>
                        </div>
                    </div>
                    
                    <!-- Footer -->
                    <div class="bg-white border-t border-gray-200 p-4 text-center text-sm text-gray-600 shadow-sm flex-shrink-0">
                        <p dir="ltr">⌨️ Shortcuts: <kbd class="px-2 py-1 bg-gray-100 rounded border border-gray-300">Space</kbd> Play/Pause • 
                        <kbd class="px-2 py-1 bg-gray-100 rounded border border-gray-300">←</kbd> -5s • 
                        <kbd class="px-2 py-1 bg-gray-100 rounded border border-gray-300">→</kbd> +5s</p>
                    </div>
                </div>
            `;
            
            // Load band player script
            loadBandPlayer(track);
        }
        
        function render404() {
            document.title = 'לא נמצא - חברות מזייפות';
            document.getElementById('app-content').innerHTML = `
                <div class="min-h-screen gradient-bg flex items-center justify-center p-8">
                    <div class="text-center">
                        <div class="text-8xl mb-4">🎵</div>
                        <h1 class="text-4xl font-bold mb-4">Song Not Found</h1>
                        <p class="text-xl text-gray-300 mb-8">The song you're looking for doesn't exist.</p>
                        <a href="./" class="inline-block bg-white text-purple-600 px-8 py-3 rounded-lg font-semibold hover:bg-gray-100 transition">
                            Back to Home
                        </a>
                    </div>
                </div>
            `;
        }
        
        function renderError(message) {
            document.getElementById('app-content').innerHTML = `
                <div class="min-h-screen bg-gray-900 flex items-center justify-center p-8">
                    <div class="text-center">
                        <div class="text-8xl mb-4">⚠️</div>
                        <h1 class="text-4xl font-bold mb-4 text-red-400">Error</h1>
                        <p class="text-xl text-gray-300 mb-8">${escapeHtml(message)}</p>
                    </div>
                </div>
            `;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        let allTracks = [];
        let preloadedSongs = new Set();
        
        
        async function preloadCollectionSongs(tracks) {
            console.log(`\n📦 Preloading ${tracks.length} songs for collection...`);
            
            let loaded = 0;
            for (const track of tracks) {
                try {
                    // Preload pitch 0 (original) for each song
                    const audioUrl = `/public/audio/pitched/${track.id}_0.mp3`;
                    
                    const response = await fetch(audioUrl);
                    if (response.ok) {
                        await response.arrayBuffer(); // Force download
                        preloadedSongs.add(track.id);
                        loaded++;
                        console.log(`  ✓ Preloaded ${loaded}/${tracks.length}: ${track.title}`);
                    }
                } catch (error) {
                    console.warn(`  ⚠️ Failed to preload: ${track.title}`, error);
                }
            }
            
            console.log(`\n✓ Collection preloading complete: ${loaded}/${tracks.length} songs ready\n`);
        }
        
        function setupSongList(tracks) {
            allTracks = tracks;
            const songItems = document.querySelectorAll('.song-item');
            
            songItems.forEach(item => {
                item.addEventListener('click', () => {
                    const trackId = item.dataset.trackId;
                    const track = allTracks.find(t => t.id === trackId);
                    if (track) {
                        console.log(`\n🎵 User selected song: ${track.title}`);
                        
                        // Update active state - highlight selected song
                        songItems.forEach(si => {
                            si.classList.remove('bg-blue-100', 'border-blue-500');
                            si.classList.add('border-transparent');
                        });
                        item.classList.add('bg-blue-100', 'border-blue-500');
                        item.classList.remove('border-transparent');
                        
                        // Scroll selected song into view (center it)
                        item.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                        
                        // Load player (user gesture = AudioContext can start)
                        loadPlayer(track);
                    }
                });
            });
            
            // NO AUTO-SELECT - User must explicitly choose a song
            // This ensures AudioContext starts with a proper user gesture
            console.log('✓ Song list ready. User must select a song to start playing.');
            
            // Check if this is collection mode (has multiple tracks) and preload in background
            const isCollectionMode = tracks.length > 1 && window.location.pathname.includes('/');
            if (isCollectionMode) {
                // Start preloading in background after a short delay (silent, no UI indication)
                setTimeout(() => preloadCollectionSongs(tracks), 500);
            }
        }
        
        // Don't initialize immediately - wait for player scripts to load
        // (Will be called from script loader below)
    </script>
    
    <!-- Player Scripts (loaded dynamically) -->
    <script>
        // Load scripts with correct base path (using global APP_BASE_PATH)
        // Use Promise-based loading to ensure scripts are ready
        const script1Promise = new Promise((resolve, reject) => {
            const script1 = document.createElement('script');
            script1.src = APP_BASE_PATH + 'player.js';
            script1.onload = resolve;
            script1.onerror = reject;
            document.head.appendChild(script1);
        });
        
        const script2Promise = new Promise((resolve, reject) => {
            const script2 = document.createElement('script');
            script2.src = APP_BASE_PATH + 'band-player.js';
            script2.onload = resolve;
            script2.onerror = reject;
            document.head.appendChild(script2);
        });
        
        // Wait for both scripts to load, then initialize the app
        Promise.all([script1Promise, script2Promise]).then(() => {
            console.log('✓ Player scripts loaded');
            init(); // Now it's safe to initialize
        }).catch((error) => {
            console.error('Failed to load player scripts:', error);
        });
    </script>
</body>
</html>
